
name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [ principal, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar plugin
        run: gradle -p XKLEscavadora build

      - name: Enviar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: XKLEscavadora-1.0.0
          path: XKLEscavadora/build/libs/*.jar
